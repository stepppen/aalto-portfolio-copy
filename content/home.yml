# General, no real projects. Opinions, not facts.
howIWork:
  - title: Watch, don't guess
    text: Five people using a rough prototype beat five meetings about a perfect one. I'd rather be surprised early than right in a slide deck.
  - title: Prototype for real
    text: A clickable thing beats a beautiful picture. If the idea needs real data, a real device or a bit of code, I'll go and build it.
  - title: The handoff isn't the finish line
    text: Design is done when it ships. I stay close to engineering until what's live matches what we meant, down to the last pixel and edge case.
  - title: Make it boring to maintain
    text: Tokens, components and names that make sense to the next person. Future me says thanks, and so does the developer who opens the file at 6 pm.
  - title: Leave room for play
    text: Good ideas tend to turn up while I'm soldering, printing or sketching something useless. So I keep time for useless things.
