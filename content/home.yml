# General, no real projects. Opinions, not facts.
howIWork:
  - title: No guessing
    text: Five people using a rough prototype beat five meetings about a perfect one. I love to go out there and get as much feedback as possible.
  - title: Interactive prototypes
    text: A clickable thing beats a beautiful picture. If the idea needs real data, a real device or a bit of code, one should build it.
  - title: Handoff drift
    text: Design is only done when the product ships. I stay close to engineering until what's live matches what we meant.
  - title: Make it boring to maintain
    text: "Keep the tokens, components and names clear and consistent. Future me says thanks :)"
  - title: Leave room for play
    text: Good ideas tend to turn up while I'm building, printing or sketching something useless. So I keep time for useless things.
