title: Noch eine 3D-gedruckte Vase
category: "Der Drucker läuft eigentlich immer, manchmal für ziemlich nutzlose Dinge."
description: "Noch eine Vase, in einer einzigen durchgehenden Spirale gedruckt, Schicht für Schicht."
instructions: "Nach oben oder unten ziehen fährt durch die Schichten, seitwärts ziehen dreht sie. Auf dem Handy: gedrückt halten, dann ziehen. Mit der Tastatur: Pfeiltasten; Pos1 und Ende leeren oder füllen sie."
