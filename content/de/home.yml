howIWork:
  - title: Hinschauen statt raten
    text: Fünf Leute mit einem groben Prototyp schlagen fünf Meetings über einen perfekten. Ich lasse mich lieber früh überraschen, als in einem Slide-Deck recht zu haben.
  - title: Echte Prototypen
    text: Etwas Klickbares schlägt ein schönes Bild. Braucht die Idee echte Daten, ein echtes Gerät oder ein bisschen Code, dann baue ich es.
  - title: Der Handoff ist nicht die Ziellinie
    text: Design ist fertig, wenn es live ist. Ich bleibe nah an der Entwicklung, bis das, was live ist, dem entspricht, was wir gemeint haben, bis zum letzten Pixel und Sonderfall.
  - title: Langweilig in der Wartung
    text: Tokens, Komponenten und Namen, die auch die nächste Person versteht. Mein zukünftiges Ich sagt danke, und die Entwicklerin, die die Datei um 18 Uhr öffnet, auch.
  - title: Platz zum Spielen
    text: Gute Ideen tauchen oft auf, während ich löte, drucke oder etwas Nutzloses skizziere. Darum nehme ich mir Zeit für nutzlose Dinge.
