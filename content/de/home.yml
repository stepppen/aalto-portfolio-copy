howIWork:
  - title: Nicht raten
    text: Fünf Leute mit einem groben Prototyp schlagen fünf Meetings über einen perfekten. Ich gehe gern raus und hole mir so viel Feedback wie möglich.
  - title: Interaktive Prototypen
    text: Etwas Klickbares schlägt ein schönes Bild. Braucht die Idee echte Daten, ein echtes Gerät oder ein bisschen Code, sollte man sie bauen.
  - title: Handoff-Drift
    text: Design ist erst fertig, wenn das Produkt live ist. Ich bleibe nah an der Entwicklung, bis das, was live ist, dem entspricht, was wir gemeint haben.
  - title: Langweilig in der Wartung
    text: "Tokens, Komponenten und Namen klar und einheitlich halten. Mein zukünftiges Ich sagt danke :)"
  - title: Platz zum Spielen
    text: Gute Ideen tauchen oft auf, während ich baue, drucke oder etwas Nutzloses skizziere. Darum nehme ich mir Zeit für nutzlose Dinge.
